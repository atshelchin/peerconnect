[workspace]
resolver = "3"
members = [
    "crates/peerconnect",
    "crates/peerconnect-relay",
    "crates/peerconnect-worker",
    "crates/peerconnect-wasm",
    "crates/peerconnect-ffi",
]
# The worker and the JS bindings only build for wasm32.
default-members = ["crates/peerconnect", "crates/peerconnect-relay", "crates/peerconnect-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/atshelchin/peerconnect"
homepage = "https://peerconnect.dev"
rust-version = "1.91"

[profile.release]
lto = true
codegen-units = 1

# Debug builds run the cryptography (generic code, compiled into the crates
# that use it) about 50 times slower unoptimized, enough to make tests that
# move megabytes time out on a busy machine.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Size-optimized build for the JavaScript SDK.
[profile.wasm]
inherits = "release"
opt-level = "s"
panic = "abort"
