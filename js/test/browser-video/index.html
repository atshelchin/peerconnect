<!doctype html>
<meta charset="utf-8" />
<title>Video latency</title>
<canvas id="b"></canvas>
<script type="module">
  import { Group, joinGroup } from "../../index.js";
  import { startVideo } from "../../video.js";

  // Two members in one page: a sends the (fake) camera, b decodes it. For
  // each frame, the time from a handing it to the group to b decoding it.
  // A camera held upright: a tall picture, red above and blue below.
  function portrait() {
    const canvas = document.createElement("canvas");
    [canvas.width, canvas.height] = [280, 480];
    const ctx = canvas.getContext("2d");
    const paint = () => {
      ctx.fillStyle = "#e00000";
      ctx.fillRect(0, 0, 280, 240);
      ctx.fillStyle = "#0000e0";
      ctx.fillRect(0, 240, 280, 240);
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, (performance.now() / 10) % 280, 8); // something moving
    };
    paint();
    setInterval(paint, 50);
    return canvas.captureStream(20);
  }

  /** The colour (r, g, b) at a point of a canvas, from 0 to 1 across and down. */
  function at(canvas, x, y) {
    const [r, g, b] = canvas.getContext("2d").getImageData(Math.floor(x * canvas.width), Math.floor(y * canvas.height), 1, 1).data;
    return r > 150 && b < 100 ? "red" : b > 150 && r < 100 ? "blue" : "other";
  }

  // The tall picture goes out tall and upright; then turned, by the sender
  // for everyone and by a receiver for itself.
  window.shape = async ({ relay }) => {
    const group = Group.create(relay);
    const a = joinGroup(group, { profile: "a" });
    const b = joinGroup(group, { profile: "b" });
    await new Promise((resolve) => {
      const check = () => a.members.size && b.members.size && resolve();
      a.addEventListener("joined", check);
      b.addEventListener("joined", check);
    });
    const shown = document.createElement("canvas");
    const va = await startVideo(a, { stream: portrait(), width: 480, height: 270, framerate: 20 });
    const vb = await startVideo(b);
    vb.attach(a.id, shown);
    const look = async () => {
      await new Promise((r) => setTimeout(r, 1500));
      return { width: shown.width, height: shown.height, top: at(shown, 0.5, 0.25), left: at(shown, 0.25, 0.5) };
    };
    const upright = await look();
    va.setRotation(90); // for everyone: red now on the right
    const turned = await look();
    va.setRotation(0);
    vb.rotateView(a.id, 270); // for b only: red on the left
    const viewed = await look();
    va.stop();
    vb.stop();
    a.leave();
    b.leave();
    return { upright, turned, viewed };
  };

  window.run = async ({ relay, seconds, webTransport, bitrate }) => {
    const group = Group.create(relay);
    const a = joinGroup(group, { profile: "a", webTransport });
    const b = joinGroup(group, { profile: "b", webTransport });
    await new Promise((resolve) => {
      const check = () => a.members.size && b.members.size && resolve();
      a.addEventListener("joined", check);
      b.addEventListener("joined", check);
    });
    const sentAt = new Map();
    const send = a.sendVideo.bind(a);
    a.sendVideo = (track, keyframe, timestamp, data) => {
      sentAt.set(timestamp, performance.now());
      return send(track, keyframe, timestamp, data);
    };
    const latencies = [];
    const camera = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 360 } });
    const va = await startVideo(a, { stream: camera, bitrate: bitrate ?? 800_000, framerate: 20 });
    const vb = await startVideo(b, {
      onFrame: (member, frame) => {
        const at = sentAt.get(Math.round(frame.timestamp / 1000) >>> 0);
        if (at !== undefined) latencies.push(performance.now() - at);
        frame.close();
      },
    });
    await new Promise((r) => setTimeout(r, seconds * 1000));
    const via = [a.via, b.via];
    const sent = va.stats();
    const received = vb.stats().members[0] ?? { received: 0, decoded: 0, errors: 0 };
    va.stop();
    vb.stop();
    camera.getTracks().forEach((t) => t.stop());
    a.leave();
    b.leave();
    latencies.sort((x, y) => x - y);
    const at = (q) => latencies[Math.floor((latencies.length - 1) * q)];
    return { via, sent, received, p50: at(0.5), p99: at(0.99), max: at(1) };
  };
  window.ready = true;
</script>
