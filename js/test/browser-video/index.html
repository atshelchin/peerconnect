<!doctype html>
<meta charset="utf-8" />
<title>Video latency</title>
<canvas id="b"></canvas>
<script type="module">
  import { Group, joinGroup } from "../../index.js";
  import { startVideo } from "../../video.js";

  // Two members in one page: a sends the (fake) camera, b decodes it. For
  // each frame, the time from a handing it to the group to b decoding it.
  // A camera held upright: a tall picture, red above and blue below.
  function portrait() {
    const canvas = document.createElement("canvas");
    [canvas.width, canvas.height] = [280, 480];
    const ctx = canvas.getContext("2d");
    const paint = () => {
      ctx.fillStyle = "#e00000";
      ctx.fillRect(0, 0, 280, 240);
      ctx.fillStyle = "#0000e0";
      ctx.fillRect(0, 240, 280, 240);
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, (performance.now() / 10) % 280, 8); // something moving
    };
    paint();
    setInterval(paint, 50);
    return canvas.captureStream(20);
  }

  /** The colour (r, g, b) at a point of a canvas, from 0 to 1 across and down. */
  function at(canvas, x, y) {
    const [r, g, b] = canvas.getContext("2d").getImageData(Math.floor(x * canvas.width), Math.floor(y * canvas.height), 1, 1).data;
    return r > 150 && b < 100 ? "red" : b > 150 && r < 100 ? "blue" : "other";
  }

  /** WebTransport options pinning the relay's certificate by `hash` (bytes), if given. */
  const pinning = (hash) => hash && { serverCertificateHashes: [{ algorithm: "sha-256", value: new Uint8Array(hash) }] };

  // The tall picture goes out tall and upright; then turned, by the sender
  // for everyone and by a receiver for itself.
  window.shape = async ({ relay, hash }) => {
    const group = Group.create(relay);
    const webTransport = pinning(hash);
    const a = joinGroup(group, { profile: "a", webTransport });
    const b = joinGroup(group, { profile: "b", webTransport });
    await new Promise((resolve) => {
      const check = () => a.members.size && b.members.size && resolve();
      a.addEventListener("joined", check);
      b.addEventListener("joined", check);
    });
    const shown = document.createElement("canvas");
    const va = await startVideo(a, { stream: portrait(), width: 480, height: 270, framerate: 20 });
    const vb = await startVideo(b);
    vb.attach(a.id, shown);
    const look = async () => {
      await new Promise((r) => setTimeout(r, 1500));
      return { width: shown.width, height: shown.height, top: at(shown, 0.5, 0.25), left: at(shown, 0.25, 0.5) };
    };
    const upright = await look();
    va.setRotation(90); // for everyone: red now on the right
    const turned = await look();
    va.setRotation(0);
    vb.rotateView(a.id, 270); // for b only: red on the left
    const viewed = await look();
    va.stop();
    vb.stop();
    a.leave();
    b.leave();
    return { upright, turned, viewed };
  };

  window.run = async ({ relay, hash, seconds, bitrate }) => {
    const group = Group.create(relay);
    const webTransport = pinning(hash);
    const a = joinGroup(group, { profile: "a", webTransport });
    const b = joinGroup(group, { profile: "b", webTransport });
    await new Promise((resolve) => {
      const check = () => a.members.size && b.members.size && resolve();
      a.addEventListener("joined", check);
      b.addEventListener("joined", check);
    });
    const sentAt = new Map();
    const send = a.sendVideo.bind(a);
    a.sendVideo = (track, layer, keyframe, timestamp, data) => {
      sentAt.set(timestamp, performance.now());
      return send(track, layer, keyframe, timestamp, data);
    };
    const latencies = [];
    const camera = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 360 } });
    const va = await startVideo(a, { stream: camera, bitrate: bitrate ?? 800_000, framerate: 20 });
    const vb = await startVideo(b, {
      onFrame: (member, frame) => {
        const at = sentAt.get(Math.round(frame.timestamp / 1000) >>> 0);
        if (at !== undefined) latencies.push(performance.now() - at);
        frame.close();
      },
    });
    await new Promise((r) => setTimeout(r, seconds * 1000));
    const connected = [a.connected, b.connected];
    const sent = va.stats();
    const received = vb.stats().members[0] ?? { received: 0, decoded: 0, errors: 0 };
    va.stop();
    vb.stop();
    camera.getTracks().forEach((t) => t.stop());
    a.leave();
    b.leave();
    latencies.sort((x, y) => x - y);
    const at = (q) => latencies[Math.floor((latencies.length - 1) * q)];
    return { connected, sent, received, p50: at(0.5), p99: at(0.99), max: at(1) };
  };
  /** Resolves once `members` all see each other. */
  function together(members) {
    return new Promise((resolve) => {
      const check = () => members.every((m) => m.members.size === members.length - 1) && resolve();
      for (const m of members) m.addEventListener("joined", check);
    });
  }

  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  // Simulcast: a sends layers 1 (640 × 360) and 2 (1280 × 720); b shows it
  // large, c small. Then c stops showing it, and b shows it small.
  window.simulcast = async ({ relay, hash, seconds }) => {
    const group = Group.create(relay);
    const webTransport = pinning(hash);
    const [a, b, c] = ["a", "b", "c"].map((profile) => joinGroup(group, { profile, webTransport }));
    await together([a, b, c]);
    const sentAt = new Map();
    const send = a.sendVideo.bind(a);
    a.sendVideo = (track, layer, keyframe, timestamp, data) => {
      sentAt.set(`${layer} ${timestamp}`, performance.now());
      return send(track, layer, keyframe, timestamp, data);
    };
    // Per receiver: latencies by layer, and when each frame was decoded.
    const seen = { b: { latencies: {}, at: [] }, c: { latencies: {}, at: [] } };
    const watch = (who) => (member, frame, track, layer) => {
      const now = performance.now();
      const at = sentAt.get(`${layer} ${Math.round(frame.timestamp / 1000) >>> 0}`);
      if (at !== undefined) (seen[who].latencies[layer] ??= []).push(now - at);
      seen[who].at.push(now);
      frame.close();
    };
    const camera = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
    const va = await startVideo(a, {
      stream: camera,
      framerate: 20,
      layers: [
        { layer: 1, width: 640, height: 360, bitrate: 400_000, minBitrate: 150_000 },
        { layer: 2, width: 1280, height: 720, bitrate: 1_500_000, minBitrate: 300_000 },
      ],
    });
    const vb = await startVideo(b, { onFrame: watch("b"), unattached: null });
    const vc = await startVideo(c, { onFrame: watch("c"), unattached: null });
    const screen = (width, height) => {
      const canvas = document.createElement("canvas");
      canvas.style.cssText = `display: block; width: ${width}px; height: ${height}px`;
      document.body.append(canvas);
      return canvas;
    };
    const big = screen(960, 540); // 540 px high: layer 2
    const small = screen(400, 225); // 225 px: layer 1
    vb.attach(a.id, big);
    vc.attach(a.id, small);
    const of = (v) => v.stats().members.find((m) => m.member === a.id) ?? { received: 0, decoded: 0, layers: [] };
    const snapshot = () => ({ a: va.stats(), b: of(vb), c: of(vc) });

    await wait(seconds * 1000);
    const both = snapshot();

    // c no longer shows it: nothing more for c, and layer 1 is no longer wanted.
    vc.attach(a.id, null);
    small.remove();
    await wait(1500);
    const cStopped = snapshot();
    await wait(2500);
    const cGone = snapshot();

    // b shows it small: layer 1 again, from its keyframe, with no gap; layer 2 stops.
    const shrunkAt = performance.now();
    big.style.width = "400px";
    big.style.height = "225px";
    await wait(2000);
    const bMoved = snapshot();
    await wait(2500);
    const bSmall = snapshot();
    const around = seen.b.at.filter((t) => t > shrunkAt - 1000 && t < shrunkAt + 3000);
    let gap = 0;
    for (let i = 1; i < around.length; i++) gap = Math.max(gap, around[i] - around[i - 1]);

    const connected = [a.connected, b.connected, c.connected];
    for (const v of [va, vb, vc]) v.stop();
    camera.getTracks().forEach((t) => t.stop());
    for (const m of [a, b, c]) m.leave();
    big.remove();
    const quantiles = (list = []) => {
      list.sort((x, y) => x - y);
      const at = (q) => list[Math.floor((list.length - 1) * q)];
      return { count: list.length, p50: at(0.5), p99: at(0.99) };
    };
    const latency = {};
    for (const who of ["b", "c"]) for (const [layer, list] of Object.entries(seen[who].latencies)) latency[`${who}${layer}`] = quantiles(list);
    return { connected, both, cStopped, cGone, bMoved, bSmall, gap, latency };
  };

  /** Joins `group` through another relay address (a proxy in front of the same relay). */
  const via = (group, relay) => Group.parse(group.toString().replace(group.relay, relay));

  /**
   * Three members, a sending layers 1 (640 × 360) and 2 (1280 × 720), b
   * asking for its layer 2, and c for layer 2 too (or 1, when a is the slow
   * one: so that a runs both). `slow` joins through `proxied`, whose rate the
   * test limits and lifts, marking when (`mark`), watching `live`, and
   * ending the run with `finish`. Returns, per receiver, every decoded
   * frame's time and layer, everyone's "videolimit" events, and a's uplink
   * and encoders as they changed; times in ms from the start.
   */
  window.adaptation = async ({ relay, proxied, hash, slow }) => {
    window.live = null;
    const group = Group.create(relay);
    const webTransport = pinning(hash);
    const [a, b, c] = ["a", "b", "c"].map((profile) =>
      joinGroup(profile === slow ? via(group, proxied) : group, { profile, webTransport }),
    );
    await together([a, b, c]);
    const start = performance.now();
    const now = () => Math.round(performance.now() - start);
    const frames = { b: [], c: [] };
    const limits = { a: [], b: [], c: [] };
    for (const [name, m] of Object.entries({ a, b, c }))
      m.addEventListener("videolimit", (e) => limits[name].push({ t: now(), layer: e.detail.layer }));
    const watch = (who) => (member, frame, track, layer) => {
      frames[who].push({ t: now(), layer });
      frame.close();
    };
    // A busy picture, so that 720p needs its bitrate (the fake camera's plain
    // picture encodes far below it, and would fit any slow link).
    const picture = busy({ width: 1280, height: 720, fps: 20, noise: 0.1 });
    const camera = picture.stream;
    const va = await startVideo(a, {
      stream: camera,
      framerate: 20,
      layers: [
        { layer: 1, width: 640, height: 360, bitrate: 400_000, minBitrate: 150_000 },
        { layer: 2, width: 1280, height: 720, bitrate: 1_500_000, minBitrate: 300_000 },
      ],
    });
    const vb = await startVideo(b, { onFrame: watch("b"), unattached: null });
    const vc = await startVideo(c, { onFrame: watch("c"), unattached: null });
    vb.setLayer(a.id, 2);
    vc.setLayer(a.id, slow === "a" ? 1 : 2);
    // a's uplink and encoders, whenever they change.
    const uplink = [];
    const poll = setInterval(() => {
      const s = va.stats();
      const state = { cappedAt: s.uplink.cappedAt, running: s.layers.filter((l) => l.running).map((l) => l.layer).join() };
      const last = uplink.at(-1);
      if (!last || last.cappedAt !== state.cappedAt || last.running !== state.running) uplink.push({ t: now(), ...state, wait: s.uplink.wait });
    }, 50);
    window.marks = [];
    window.mark = (label) => window.marks.push({ t: now(), label });
    window.live = { frames, limits, uplink, now };
    /** Whether `who` decoded a frame of `layer` since the mark `label`. */
    window.decodedSince = (who, layer, label) => {
      const since = window.marks.find((m) => m.label === label)?.t ?? Infinity;
      return frames[who].some((f) => f.layer === layer && f.t > since);
    };
    await new Promise((r) => (window.finish = r));
    clearInterval(poll);
    const connected = [a.connected, b.connected, c.connected];
    const stats = { a: va.stats(), b: vb.stats(), c: vc.stats() };
    for (const v of [va, vb, vc]) v.stop();
    camera.getTracks().forEach((t) => t.stop());
    for (const m of [a, b, c]) m.leave();
    return { connected, frames, limits, uplink, marks: window.marks, stats: { a: { uplink: stats.a.uplink, layers: stats.a.layers } } };
  };

  /**
   * A busy picture of `width` × `height` at `fps`, as a screen with text
   * looks: rows of text, a counter and a moving bar, under a band of
   * `noise` (0–1 of the height) of fixed random pixels, which make
   * keyframes large (the encoder must draw every one) and deltas small.
   */
  function busy({ width, height, fps, noise = 0 }) {
    const canvas = document.createElement("canvas");
    [canvas.width, canvas.height] = [width, height];
    const ctx = canvas.getContext("2d");
    const band = Math.round(height * noise);
    const grain = band ? ctx.createImageData(width, band) : null;
    if (grain) {
      let seed = 7;
      for (let i = 0; i < grain.data.length; i += 4) {
        seed = (seed * 48271) % 2147483647;
        const v = seed & 0xff;
        [grain.data[i], grain.data[i + 1], grain.data[i + 2], grain.data[i + 3]] = [v, (v * 7) & 0xff, 255 - v, 255];
      }
    }
    let n = 0;
    const paint = () => {
      n++;
      ctx.fillStyle = "#f4f4f4";
      ctx.fillRect(0, 0, width, height);
      if (grain) ctx.putImageData(grain, 0, 0);
      ctx.fillStyle = "#222";
      ctx.font = "15px monospace";
      for (let y = band + 38; y < height - 70; y += 20) ctx.fillText(`${y} the quick brown fox jumps over the lazy dog, 0123456789 `.repeat(4), 6, y);
      ctx.font = "bold 18px monospace";
      ctx.fillText(`frame ${n}`, 6, band + 18);
      ctx.fillStyle = "#e00000";
      ctx.fillRect((n * 23) % width, height - 60, 120, 40);
    };
    paint();
    const timer = setInterval(paint, 1000 / fps);
    const stream = canvas.captureStream(fps);
    return { stream, stop: () => (clearInterval(timer), stream.getTracks().forEach((t) => t.stop())) };
  }

  /** Records what `m` sends: per track and layer, each frame's size, and whether it was a keyframe. */
  function recordSends(m) {
    const sent = [];
    const send = m.sendVideo.bind(m);
    m.sendVideo = (track, layer, keyframe, timestamp, data) => {
      const ok = send(track, layer, keyframe, timestamp, data);
      sent.push({ t: performance.now(), track, layer, keyframe, timestamp, size: data.length, codec: data[0], ok });
      return ok;
    };
    return sent;
  }

  /**
   * Two tracks from one member: a sends its camera as track 0 (layers 0
   * and 1) and a screen as track 1 (layers 1, 2 and 3; 1 in `screenCodec`
   * if given), from a second Video that only sends. b shows the screen
   * large and the camera small, c both at gallery size; then b shows the
   * screen small too.
   */
  window.tracks = async ({ relay, hash, seconds, screenCodec }) => {
    const group = Group.create(relay);
    const webTransport = pinning(hash);
    const [a, b, c] = ["a", "b", "c"].map((profile) => joinGroup(group, { profile, webTransport }));
    await together([a, b, c]);
    const sent = recordSends(a);
    const camera = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
    const screen = busy({ width: 1920, height: 1080, fps: 15 });
    const limits = { a: [], b: [], c: [] };
    for (const [name, m] of Object.entries({ a, b, c })) m.addEventListener("videolimit", (e) => limits[name].push(e.detail.layer));
    const vaCamera = await startVideo(a, {
      stream: camera,
      framerate: 20,
      layers: [
        { layer: 0, width: 320, height: 180, bitrate: 150_000, minBitrate: 60_000 },
        { layer: 1, width: 640, height: 360, bitrate: 400_000, minBitrate: 150_000 },
      ],
    });
    const vaScreen = await startVideo(a, {
      track: 1,
      receive: false,
      stream: screen.stream,
      framerate: 15,
      contentHint: "detail",
      layers: [
        { layer: 1, width: 640, height: 360, bitrate: 300_000, codec: screenCodec },
        { layer: 2, width: 1280, height: 720, bitrate: 1_000_000 },
        { layer: 3, width: 1920, height: 1080, bitrate: 2_500_000, minBitrate: 800_000 },
      ],
    });
    const decodedAt = { b: [], c: [] };
    const watch = (who) => (member, frame, track, layer) => {
      decodedAt[who].push({ t: performance.now(), track, layer, width: frame.displayWidth, timestamp: Math.round(frame.timestamp / 1000) >>> 0 });
      frame.close();
    };
    const vb = await startVideo(b, { onFrame: watch("b"), unattached: null });
    const vc = await startVideo(c, { onFrame: watch("c"), unattached: null });
    const shown = (width, height) => {
      const canvas = document.createElement("canvas");
      canvas.style.cssText = `display: block; width: ${width}px; height: ${height}px`;
      document.body.append(canvas);
      return canvas;
    };
    const canvases = {
      bScreen: shown(1440, 810), // 810 rows: layer 3
      bCamera: shown(160, 90), // 90: layer 0
      cScreen: shown(400, 225), // 225: layer 1
      cCamera: shown(400, 225),
    };
    vb.attach(a.id, canvases.bScreen, { track: 1 });
    vb.attach(a.id, canvases.bCamera);
    vc.attach(a.id, canvases.cScreen, { track: 1 });
    vc.attach(a.id, canvases.cCamera, { track: 0 });
    const of = (v, track) => v.stats().members.find((m) => m.member === a.id && m.track === track) ?? { received: 0, decoded: 0, errors: 0, layers: [] };
    const snapshot = () => ({
      camera: vaCamera.stats(),
      screen: vaScreen.stats(),
      demand: [...a.videoDemand],
      b: { camera: of(vb, 0), screen: of(vb, 1) },
      c: { camera: of(vc, 0), screen: of(vc, 1) },
      pixels: Object.fromEntries(Object.entries(canvases).map(([k, cv]) => [k, [cv.width, cv.height]])),
    });
    await wait(seconds * 1000);
    const both = snapshot();
    // b shows the screen small: layer 1 of it, from its keyframe (another codec, if layer 3 had one).
    const shrunkAt = performance.now();
    canvases.bScreen.style.cssText = "display: block; width: 400px; height: 225px";
    await wait(3000);
    const bSmall = snapshot();
    const around = decodedAt.b.filter((f) => f.track === 1 && f.t > shrunkAt - 1000 && f.t < shrunkAt + 3000);
    let gap = 0;
    for (let i = 1; i < around.length; i++) gap = Math.max(gap, around[i].t - around[i - 1].t);
    const connected = [a.connected, b.connected, c.connected];
    for (const v of [vaCamera, vaScreen, vb, vc]) v.stop();
    camera.getTracks().forEach((t) => t.stop());
    screen.stop();
    for (const m of [a, b, c]) m.leave();
    for (const canvas of Object.values(canvases)) canvas.remove();
    const keyframes = {};
    for (const s of sent) if (s.keyframe) (keyframes[`${s.track} ${s.layer}`] ??= []).push(s.size);
    return { connected, both, bSmall, gap, keyframes, limits };
  };

  /**
   * 1080p from a busy picture (`noise` of it random, for large keyframes):
   * a sends layer 3 only, in `codec` if given, b receives it. Returns the
   * size of every keyframe sent, which of them b decoded, and b's numbers.
   */
  window.fullHd = async ({ relay, hash, seconds, codec, noise, bitrate = 3_500_000 }) => {
    const group = Group.create(relay);
    const webTransport = pinning(hash);
    const [a, b] = ["a", "b"].map((profile) => joinGroup(group, { profile, webTransport }));
    await together([a, b]);
    const sent = recordSends(a);
    const picture = busy({ width: 1920, height: 1080, fps: 15, noise });
    const va = await startVideo(a, {
      stream: picture.stream,
      framerate: 15,
      layers: [{ layer: 3, width: 1920, height: 1080, bitrate, minBitrate: 1_000_000, codec }],
    });
    const decoded = new Map();
    const vb = await startVideo(b, {
      onFrame: (member, frame, track, layer) => {
        decoded.set(Math.round(frame.timestamp / 1000) >>> 0, { width: frame.displayWidth, height: frame.displayHeight, layer });
        frame.close();
      },
    });
    vb.setLayer(a.id, 3);
    // What b missed before it listened is not counted.
    const from = performance.now() + 500;
    // How long a's backlog takes to empty from each peak over 100 KB (a keyframe).
    const drains = [];
    let peak = null;
    const sampler = setInterval(() => {
      const { queued } = a.videoBacklog;
      if (queued > 100_000 && (!peak || queued > peak.queued)) peak = { queued, t: peak?.t ?? performance.now() };
      if (peak && queued === 0) drains.push({ bytes: peak.queued, ms: Math.round(performance.now() - peak.t) }), (peak = null);
    }, 2);
    await wait(seconds * 1000);
    clearInterval(sampler);
    const connected = [a.connected, b.connected];
    const stats = { a: va.stats(), b: vb.stats().members.find((m) => m.member === a.id && m.track === 0) };
    va.stop();
    vb.stop();
    picture.stop();
    a.leave();
    b.leave();
    // Frames sent after the last second may still be on their way.
    const settled = sent.filter((s) => s.t > from && s.t < sent.at(-1).t - 1000);
    const keyframes = settled.filter((s) => s.keyframe).map((s) => ({ size: s.size, ok: s.ok, decoded: decoded.get(s.timestamp) ?? null }));
    const deltas = settled.filter((s) => !s.keyframe).map((s) => s.size);
    return { drains, dropped: a.videoBacklog.dropped, connected, stats, keyframes, sent: settled.length, decodedSent: settled.filter((s) => decoded.has(s.timestamp)).length, deltaMax: Math.max(0, ...deltas) };
  };

  /** The codec each layer picks by default, at the sizes the demo sends. */
  window.codecs = async ({ relay, hash }) => {
    const group = Group.create(relay);
    const a = joinGroup(group, { profile: "a", webTransport: pinning(hash) });
    const picture = busy({ width: 1920, height: 1080, fps: 15 });
    const v = await startVideo(a, {
      stream: picture.stream,
      layers: [
        { layer: 0, width: 320, height: 180, bitrate: 150_000 },
        { layer: 1, width: 640, height: 360, bitrate: 400_000 },
        { layer: 2, width: 1280, height: 720, bitrate: 1_500_000 },
        { layer: 3, width: 1920, height: 1080, bitrate: 3_500_000 },
      ],
    });
    const layers = v.stats().layers.map((l) => ({ layer: l.layer, codec: l.codec, hardware: l.hardware }));
    v.stop();
    picture.stop();
    a.leave();
    return layers;
  };

  window.ready = true;
</script>
