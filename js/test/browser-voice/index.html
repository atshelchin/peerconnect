<!doctype html>
<meta charset="utf-8" />
<title>Voice latency</title>
<script type="module">
  import { Group, joinGroup } from "../../index.js";
  import { copiesIn, startVoice, withCopies } from "../../voice.js";

  /** WebTransport options pinning the relay's certificate by `hash` (bytes), if given. */
  const pinning = (hash) => hash && { serverCertificateHashes: [{ algorithm: "sha-256", value: new Uint8Array(hash) }] };

  // Two members in one page; measures, per frame of a's voice, the time from
  // the end of its capture to the start of its playout at b.
  window.run = async ({ relay, hash, seconds, vad, minDelay, maxDelay, redundancy }) => {
    // Frames with sound in them (over -55 dBFS), and how many of those went out.
    const sender = { sound: 0, soundSent: 0, sent: 0 };
    const group = Group.create(relay);
    const webTransport = pinning(hash);
    const a = joinGroup(group, { profile: "a", webTransport });
    const b = joinGroup(group, { profile: "b", webTransport });
    await new Promise((resolve) => {
      const check = () => a.members.size && b.members.size && resolve();
      a.addEventListener("joined", check);
      b.addEventListener("joined", check);
    });
    let sent = 0;
    let bytes = 0; // voice payloads, to see what redundancy costs
    let received = 0;
    // Which frames went out with sound in them, and which of those played.
    const soundSeqs = new Set();
    const playedSeqs = new Set();
    const send = a.sendVoice.bind(a);
    a.sendVoice = (seq, data) => {
      sent++;
      bytes += data.length;
      return send(seq, data);
    };
    b.addEventListener("voice", () => received++);
    const captured = new Map();
    const latencies = [];
    const tail = []; // the last 2 s
    let end = 0;
    const va = await startVoice(a, {
      vad,
      redundancy,
      onCapture: (seq, now) => captured.set(seq, now),
      onFrame: ({ seq, rms, sending }) => {
        if (end && sending && rms > 10 ** (-55 / 20) && performance.now() < end - 1000) soundSeqs.add(seq);
        // From a second after the measurement starts.
        if (end && performance.now() > end - seconds * 1000 + 1000) {
          if (rms > 10 ** (-55 / 20)) (sender.sound++, sending && sender.soundSent++);
          if (sending) sender.sent++;
        }
      },
    });
    const vb = await startVoice(b, {
      vad,
      minDelay,
      maxDelay,
      onPlay: (member, seq, now) => {
        if (member === a.id) playedSeqs.add(seq);
        if (member === a.id && captured.has(seq)) {
          latencies.push(now - captured.get(seq));
          if (now > end - 2000) tail.push(now - captured.get(seq));
        }
      },
    });
    end = performance.now() + seconds * 1000;
    await new Promise((resolve) => setTimeout(resolve, seconds * 1000));
    const stats = Object.fromEntries(vb.stats());
    const context = new AudioContext();
    const output = { base: context.baseLatency, output: context.outputLatency };
    await context.close();
    const connected = [a.connected, b.connected];
    await va.stop();
    await vb.stop();
    a.leave();
    b.leave();
    latencies.sort((x, y) => x - y);
    const at = (q) => latencies[Math.floor((latencies.length - 1) * q)];
    tail.sort((x, y) => x - y);
    return {
      frames: latencies.length,
      p50: at(0.5),
      p90: at(0.9),
      p99: at(0.99),
      max: at(1),
      tail: tail[Math.floor(tail.length / 2)],
      stats: stats[a.id],
      output,
      sent,
      bytes,
      received,
      sender,
      lostSound: [...soundSeqs].filter((s) => !playedSeqs.has(s)).length,
      soundSent: soundSeqs.size,
      connected,
    };
  };
  // Listening only until the microphone is turned on, and released again when it is turned off.
  window.microphone = async ({ relay, hash }) => {
    const calls = [];
    const real = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
    navigator.mediaDevices.getUserMedia = async (c) => {
      const stream = await real(c);
      calls.push(stream);
      return stream;
    };
    const group = Group.create(relay);
    const a = joinGroup(group, { profile: "a", webTransport: pinning(hash) });
    let sent = 0;
    const send = a.sendVoice.bind(a);
    a.sendVoice = (seq, data) => (sent++, send(seq, data));
    const voice = await startVoice(a, { microphone: false, vad: false });
    await new Promise((r) => setTimeout(r, 500));
    const before = { asked: calls.length, sent, on: voice.microphone };
    await voice.setMicrophone(true);
    await new Promise((r) => setTimeout(r, 500));
    const during = { asked: calls.length, sent, on: voice.microphone };
    await voice.setMicrophone(false);
    const ended = calls[0]?.getAudioTracks()[0]?.readyState;
    const atOff = sent;
    await new Promise((r) => setTimeout(r, 500));
    const after = { sentSinceOff: sent - atOff, on: voice.microphone, ended };
    await voice.stop();
    a.leave();
    navigator.mediaDevices.getUserMedia = real;
    return { before, during, after };
  };
  // Copies in the padding change nothing for a decoder that knows nothing
  // of them (as older receivers do not): it plays exactly the same samples.
  window.padding = async () => {
    const encoded = [];
    const encoder = new AudioEncoder({ output: (chunk) => encoded.push(chunk), error: (e) => console.log(e) });
    encoder.configure({ codec: "opus", sampleRate: 48000, numberOfChannels: 1, bitrate: 32000, opus: { frameDuration: 20000, complexity: 10 } });
    for (let f = 0; f < 50; f++) {
      const pcm = new Float32Array(960).map((_, i) => 0.3 * Math.sin((2 * Math.PI * 180 * (f * 960 + i)) / 48000) + 0.05 * (Math.random() - 0.5));
      encoder.encode(new AudioData({ format: "f32-planar", sampleRate: 48000, numberOfFrames: 960, numberOfChannels: 1, timestamp: f * 20000, data: pcm }));
    }
    await encoder.flush();
    encoder.close();
    const packets = encoded.map((chunk) => {
      const p = new Uint8Array(chunk.byteLength);
      chunk.copyTo(p);
      return p;
    });
    const padded = packets.map((p, i) => withCopies(p, [[1, packets[i - 1]], [2, packets[i - 2]]].filter(([, c]) => c)));
    const decode = async (list) => {
      const out = [];
      const decoder = new AudioDecoder({
        output: (audio) => {
          const pcm = new Float32Array(audio.numberOfFrames);
          audio.copyTo(pcm, { planeIndex: 0, format: "f32-planar" });
          audio.close();
          out.push(...pcm);
        },
        error: (e) => console.log(e),
      });
      decoder.configure({ codec: "opus", sampleRate: 48000, numberOfChannels: 1 });
      list.forEach((data, i) => decoder.decode(new EncodedAudioChunk({ type: "key", timestamp: i * 20000, data })));
      await decoder.flush();
      decoder.close();
      return out;
    };
    const [plain, withPadding] = [await decode(packets), await decode(padded)];
    const copies = padded.slice(2).every((p, i) => {
      const [[b1, c1], [b2, c2]] = copiesIn(p);
      const same = (x, y) => x.length === y.length && x.every((v, k) => v === y[k]);
      return b1 === 1 && b2 === 2 && same(c1, packets[i + 1]) && same(c2, packets[i]);
    });
    return {
      packets: packets.length,
      bytes: packets.reduce((n, p) => n + p.length, 0) / packets.length,
      paddedBytes: padded.reduce((n, p) => n + p.length, 0) / padded.length,
      samples: plain.length,
      identical: plain.length > 0 && plain.length === withPadding.length && plain.every((v, i) => v === withPadding[i]),
      copies,
    };
  };
  window.ready = true;
</script>
