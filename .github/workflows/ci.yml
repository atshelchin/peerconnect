name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --features peerconnect/client -p peerconnect -p peerconnect-relay -- -D warnings
      - run: cargo clippy -p peerconnect-worker -p peerconnect-wasm --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test
      - run: node test-vectors/verify.mjs

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the wasm-bindgen CLI matching Cargo.lock
        run: cargo install wasm-bindgen-cli --locked --version "$(cargo pkgid -p wasm-bindgen | sed 's/.*@//')"
      - run: cargo build -p peerconnect-relay && cargo build -p peerconnect --features client --example chat
      - run: sh js/scripts/build.sh
      - run: npm test
        working-directory: js

  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo install worker-build --locked
      - name: Run the Worker locally and test it
        working-directory: crates/peerconnect-worker
        run: |
          npx --yes wrangler@4 dev --port 8787 --ip 127.0.0.1 > wrangler.log 2>&1 &
          for i in $(seq 1 180); do curl -sf http://127.0.0.1:8787/ && break; sleep 2; done
          PEERCONNECT_RELAY=ws://127.0.0.1:8787 cargo test -p peerconnect-relay --test e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t peerconnect-relay .
      - uses: dtolnay/rust-toolchain@stable
      - name: Test the image
        run: |
          docker run -d -p 8080:8080 peerconnect-relay
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/healthz && break; sleep 1; done
          PEERCONNECT_RELAY=ws://127.0.0.1:8080 cargo test -p peerconnect-relay --test e2e
