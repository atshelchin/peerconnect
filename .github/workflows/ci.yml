name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --features peerconnect/client -p peerconnect -p peerconnect-relay -p peerconnect-ffi -- -D warnings
      - run: cargo clippy -p peerconnect-worker -p peerconnect-wasm --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test
      # The group suite again with every member on QUIC, and the simulation
      # as over QUIC (classes overtaking each other, voice out of order).
      - run: PEERCONNECT_TRANSPORT=quic cargo test -p peerconnect-relay --test group_e2e
      - run: for seed in $(seq 1 100); do PEERCONNECT_SIM_QUIC=$seed cargo test -q -p peerconnect --test group || exit 1; done
      - run: node test-vectors/verify.mjs
      - run: node test-vectors/verify-groups.mjs

  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the wasm-bindgen CLI matching Cargo.lock
        run: cargo install wasm-bindgen-cli --locked --version "$(cargo pkgid -p wasm-bindgen | sed 's/.*@//')"
      - run: cargo build -p peerconnect-relay && cargo build -p peerconnect --features client --example chat --example group
      - run: sh js/scripts/build.sh
      - run: npm test
        working-directory: js

  website:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@v2
      - name: Install the wasm-bindgen CLI matching Cargo.lock
        run: cargo install wasm-bindgen-cli --locked --version "$(cargo pkgid -p wasm-bindgen | sed 's/.*@//')"
      - run: sh js/scripts/build.sh
      - working-directory: website
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run lint
          bunx vitest --run
          bunx playwright install --with-deps chromium
          bunx playwright test
      # Browser voice (latency, jitter, TCP stalls, lossy UDP over
      # WebTransport) and browsers over WebTransport with a Rust member on
      # raw QUIC, in headless Chromium, using the website's Playwright.
      - run: cargo build -p peerconnect-relay && cargo build -p peerconnect --features client --example group
      - run: node js/test/voice.browser.mjs
      - run: node js/test/webtransport.browser.mjs
      - run: node js/test/video.browser.mjs

  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo install worker-build --locked
      # Compile the tests first, so the build does not compete with workerd.
      - run: cargo test -p peerconnect-relay --test e2e --test group_e2e --no-run
      - name: Run the Worker locally and test it
        working-directory: crates/peerconnect-worker
        run: |
          npx --yes wrangler@4 dev --port 8787 --ip 127.0.0.1 > wrangler.log 2>&1 &
          for i in $(seq 1 180); do curl -sf http://127.0.0.1:8787/ && break; sleep 2; done
          PEERCONNECT_RELAY=ws://127.0.0.1:8787 cargo test -p peerconnect-relay --test e2e --test group_e2e || { cat wrangler.log; exit 1; }

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t peerconnect-relay .
      - uses: dtolnay/rust-toolchain@stable
      - name: Test the image
        run: |
          docker run -d -p 8080:8080 -p 8080:8080/udp peerconnect-relay
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/healthz && break; sleep 1; done
          PEERCONNECT_RELAY=ws://127.0.0.1:8080 cargo test -p peerconnect-relay --test e2e --test group_e2e
          PEERCONNECT_RELAY=quic://127.0.0.1:8080 cargo test -p peerconnect-relay --test group_e2e
