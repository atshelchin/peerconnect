# A relay with automatic HTTPS: set DOMAIN to a name pointing at this host,
#   DOMAIN=relay.example.com docker compose up -d
# and use wss://relay.example.com as the relay URL, or, for groups,
# https://relay.example.com: WebTransport and QUIC on UDP 443, falling back
# to wss:// where UDP does not get through. Open TCP 80 and 443, and UDP 443.
#
# Caddy terminates TLS on TCP; UDP 443 goes straight to the relay, which
# uses the certificate Caddy obtains and renews. On the very first start the
# relay restarts until Caddy has it (a minute or so).
services:
  relay:
    build: ..
    restart: unless-stopped
    ports: ["443:443/udp"]
    # Caddy's certificate files are readable by their owner only.
    user: "0:0"
    environment:
      PEERCONNECT_MAX_CONNECTIONS: "10000"
      PEERCONNECT_MAX_PER_ADDRESS: "256"
      PEERCONNECT_MAX_GROUP_MEMBERS: "4"
      # Caddy appends the client's address to X-Forwarded-For.
      PEERCONNECT_TRUST_PROXY: "1"
      PEERCONNECT_QUIC_LISTEN: "0.0.0.0:443"
      PEERCONNECT_TLS_CERT: /caddy/caddy/certificates/acme-v02.api.letsencrypt.org-directory/${DOMAIN}/${DOMAIN}.crt
      PEERCONNECT_TLS_KEY: /caddy/caddy/certificates/acme-v02.api.letsencrypt.org-directory/${DOMAIN}/${DOMAIN}.key
    volumes:
      - caddy-data:/caddy:ro
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    # Keep little unsent data in the kernel towards clients, so that a slow
    # link backs up into the relay's queues, where commands overtake chat
    # and late voice is dropped, instead of into a socket buffer that
    # delays everything alike. (The relay sets this on its own sockets.)
    sysctls:
      net.ipv4.tcp_notsent_lowat: "32768"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN to the relay's host name}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
volumes:
  caddy-data:
