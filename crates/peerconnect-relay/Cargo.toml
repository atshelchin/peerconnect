[package]
name = "peerconnect-relay"
description = "PeerConnect relay server for Linux and Docker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
peerconnect = { path = "../peerconnect" }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[dev-dependencies]
peerconnect = { path = "../peerconnect", features = ["client"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
