name = "peerconnect-relay"
main = "build/worker/shim.mjs"
compatibility_date = "2026-05-01"

[build]
command = "worker-build --release"

[durable_objects]
bindings = [{ name = "ROOMS", class_name = "Room" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Group"]

# Groups moved to the Linux relay (QUIC only, GROUP.md §3.6).
[[migrations]]
tag = "v3"
deleted_classes = ["Group"]
