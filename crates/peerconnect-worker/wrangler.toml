name = "peerconnect-relay"
main = "build/worker/shim.mjs"
compatibility_date = "2026-05-01"

[build]
command = "worker-build --release"

[durable_objects]
bindings = [{ name = "ROOMS", class_name = "Room" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Group"]

# v2 and v3 added and removed the Group object of the groups protocol (tag
# groups-voice-video). They stay: Cloudflare keeps the migration history.
[[migrations]]
tag = "v3"
deleted_classes = ["Group"]
