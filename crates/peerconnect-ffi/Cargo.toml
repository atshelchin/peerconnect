[package]
name = "peerconnect-ffi"
description = "C ABI for PeerConnect groups, for game engines (Unity, Unreal, Godot) and other languages"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
publish = false

[lib]
# libpeerconnect_ffi.so / .dylib / peerconnect_ffi.dll, and a static library.
name = "peerconnect_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# `client`: pc_client_* connects over QUIC by itself, on the library's threads.
peerconnect = { path = "../peerconnect", features = ["client"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
peerconnect-relay = { path = "../peerconnect-relay" }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
