[package]
name = "peerconnect-wasm"
description = "WebAssembly bindings behind the PeerConnect JavaScript SDK"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
peerconnect = { path = "../peerconnect", default-features = false }
getrandom = { version = "0.4", features = ["wasm_js"] }
js-sys = "0.3"
wasm-bindgen = "0.2.129"
